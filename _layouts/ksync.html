<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "kSync — Media Synchronization, Made in Berlin" }}</title>
    <meta name="description" content="{{ page.description | default: 'kSync keeps walls of displays frame-locked to sub-10ms and fires lighting, sound, and automation on the same timeline. A plug-and-play box, deployed in minutes, yours forever.' }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/ksync.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="{{ '/ksync' | relative_url }}" class="brand">kSync</a>
        <div class="header-meta">
            <span class="tc-readout" id="tc">00:00:00:00</span>
            <a class="nav-link" href="#spec">Specification</a>
            <a class="nav-link" href="#compare">Comparison</a>
            <a class="nav-link" href="#contact">Email</a>
        </div>
    </div>
</header>

<div class="bars" aria-hidden="true"></div>

<div class="page">
    <aside class="rail" aria-hidden="true">
        <div class="rail-inner" id="rail"></div>
    </aside>

    <main class="content">
        {{ content }}
    </main>
</div>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="row">
            <span>kSync — media synchronization for exhibitions, events, and storefronts.</span>
            <span><a href="https://www.linkedin.com/in/grayson-earle/">LinkedIn</a> &nbsp;·&nbsp; <a href="mailto:studio@graysonearle.com">studio@graysonearle.com</a></span>
            <span>&copy; 2026 Grayson Earle</span>
        </div>
    </div>
</footer>

<script>
(function () {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var tcEl = document.getElementById('tc');
    var railEl = document.getElementById('rail');
    var sections = Array.prototype.slice.call(document.querySelectorAll('section.cue'));
    var fmt = function (t) {
        var f = Math.floor(t * 25) % 25;
        var s = Math.floor(t) % 60;
        var m = Math.floor(t / 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ':' + String(f).padStart(2, '0');
    };

    function buildRail() {
        if (!railEl || !sections.length) return;
        railEl.innerHTML = '';
        railEl.insertAdjacentHTML('afterbegin', '<div class="rail-line"></div>');
        var contentEl = document.querySelector('.content');
        var start = contentEl.getBoundingClientRect().top + window.scrollY;
        var total = contentEl.getBoundingClientRect().height;
        sections.forEach(function (sec, i) {
            var center = sec.getBoundingClientRect().top + window.scrollY + sec.getBoundingClientRect().height / 2;
            var ratio = Math.min(1, Math.max(0, (center - start) / total));
            var tc = fmt(0.25 + 0.6 * ratio * 60);
            var cue = document.createElement('div');
            cue.className = 'rail-cue' + (i === 0 ? ' active' : '');
            cue.dataset.index = i;
            cue.innerHTML = '<span class="tc">' + tc + '</span><span>' + (sec.dataset.cue || '') + '</span>';
            railEl.appendChild(cue);
        });
        positionCues();
    }

    function buildCuePositions() {
        var track = railEl.offsetHeight - 44;
        var contentEl = document.querySelector('.content');
        var start = contentEl.offsetTop;
        var total = contentEl.offsetHeight;
        Array.prototype.slice.call(railEl.querySelectorAll('.rail-cue')).forEach(function (el, i) {
            var sec = sections[i];
            var center = sec.offsetTop + sec.offsetHeight / 2;
            var ratio = Math.min(1, Math.max(0, (center - start) / total));
            el.style.top = (22 + ratio * track) + 'px';
        });
    }

    function paint() {
        var h = window.innerHeight;
        var idx = -1;
        sections.forEach(function (sec, i) {
            var top = sec.getBoundingClientRect().top;
            if (top <= h * 0.45) idx = i;
        });
        if (idx < 0) idx = 0;
        Array.prototype.forEach.call(railEl.querySelectorAll('.rail-cue'), function (el) {
            el.classList.toggle('active', Number(el.dataset.index) === idx);
        });
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var p = Math.min(1, Math.max(0, (window.scrollY || doc.scrollTop) / max));
        tcEl.textContent = fmt(60 * p);
    }

    var ticking = false;
    window.addEventListener('scroll', function () {
        if (!ticking) {
            window.requestAnimationFrame(function () { paint(); ticking = false; });
            ticking = true;
        }
    }, { passive: true });
    window.addEventListener('resize', buildRail);

    if (!reduced) {
        var start = null;
        var dur = 700;
        var from = 0, to = 3.5;
        function roll(ts) {
            if (!start) start = ts;
            var t = Math.min(1, (ts - start) / dur);
            var e = 1 - Math.pow(1 - t, 3);
            tcEl.textContent = fmt(from + (to - from) * e);
            if (t < 1) window.requestAnimationFrame(roll);
        }
        window.requestAnimationFrame(roll);
    } else {
        tcEl.textContent = fmt(0);
    }

    buildRail();
    paint();
})();
</script>
</body>
</html>
